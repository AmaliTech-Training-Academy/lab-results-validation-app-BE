services:
  postgres:
    image: postgres:16
    container_name: labresultsvalidator-db
    restart: on-failure:2
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labresultsvalidator-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./labresultsvalidator
      dockerfile: Dockerfile
    container_name: labresultsvalidator-app
    restart: on-failure:2
    # Gives -XX:MaxRAMPercentage (Dockerfile) something concrete to size the heap against —
    # without this the JVM sizes off host RAM instead of the container's actual budget.
    mem_limit: 1g
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
    name: labresultsvalidator-db-data