spring.application.name=labresultsvalidator

spring.config.import=optional:file:./.env[.properties]

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.flyway.enabled=true

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# Redis configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Refresh token cookie
jwt.refresh-cookie-name=refresh_token

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Frontend URL — used in password reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Backend base URL — used to build absolute paths for hosted email images
app.base-url=${BASE_URL:http://localhost:8080}

# CSV upload limits (PRD: 5MB cap; row cap enforced in CsvParserService)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Don't let the SMTP reachability check drag the overall health to DOWN (dev uses placeholder creds).
management.health.mail.enabled=false

# ---- Microsoft Graph / SharePoint ----
azure.graph.tenant-id=${AZURE_TENANT_ID}
azure.graph.client-id=${AZURE_CLIENT_ID}
azure.graph.client-secret=${AZURE_CLIENT_SECRET}
# The SharePoint site ID the cohort folders must live in (e.g. tenant.sharepoint.com,siteGUID,webGUID)
azure.graph.sanctioned-site-id=${SHAREPOINT_SITE_ID}

# ---- SharePoint folder + file naming (D-LIT — PO to confirm) ----
# Folder names are matched case-insensitively against what Graph API returns.
labgate.sharepoint.reference-folder=${SHAREPOINT_REFERENCE_FOLDER:Reference Data}
labgate.sharepoint.scores-folder=${SHAREPOINT_SCORES_FOLDER:Lab Scores}
# Exact filenames for the 5 reference files (matched case-insensitively against SharePoint)
labgate.sharepoint.ref-files.specializations=${SP_REF_FILE_SPECIALIZATIONS:Specializations.xlsx}
labgate.sharepoint.ref-files.modules=${SP_REF_FILE_MODULES:Module Setup.xlsx}
labgate.sharepoint.ref-files.labs=${SP_REF_FILE_LABS:Lab Reference.xlsx}
labgate.sharepoint.ref-files.learners=${SP_REF_FILE_LEARNERS:Trainee Database.xlsx}
labgate.sharepoint.ref-files.instructors=${SP_REF_FILE_INSTRUCTORS:Quiz Reference.xlsx}

# Max workbook size accepted (bytes) — checked against the size Graph reports before download,
# and enforced again as a bounded read so an oversized file can't exhaust the heap.
labgate.sharepoint.max-workbook-bytes=${SP_MAX_WORKBOOK_BYTES:20971520}

# ---- Graph retry / backoff (B4 AC4) ----
# Retries 429 (throttling), 5xx and 401 (mid-run token expiry). A server-supplied Retry-After
# always wins over the computed backoff; the three ceilings stop a hostile or oversized value
# from stalling a run.
labgate.graph.retry.max-attempts=${GRAPH_RETRY_MAX_ATTEMPTS:4}
labgate.graph.retry.initial-backoff-millis=${GRAPH_RETRY_INITIAL_BACKOFF_MS:1000}
labgate.graph.retry.max-backoff-millis=${GRAPH_RETRY_MAX_BACKOFF_MS:30000}
labgate.graph.retry.max-retry-after-millis=${GRAPH_RETRY_MAX_RETRY_AFTER_MS:120000}
labgate.graph.retry.max-total-wait-millis=${GRAPH_RETRY_MAX_TOTAL_WAIT_MS:180000}

# ---- Apache POI hardening (risk R-10: untrusted .xlsx parsed in-process) ----
# min-inflate-ratio bounds zip-bomb expansion (POI's own default is 0.01; 0.0005 is looser to
# tolerate legitimately repetitive sheets while still capping expansion at 2000:1).
# max-entry-bytes caps any single decompressed entry regardless of ratio.
labgate.poi.min-inflate-ratio=${POI_MIN_INFLATE_RATIO:0.0005}
labgate.poi.max-entry-bytes=${POI_MAX_ENTRY_BYTES:20971520}

# Pending bundle TTL in seconds (how long Gate 3 result is held before re-run required)
labgate.standup.pending-bundle-ttl-seconds=${STANDUP_PENDING_TTL:3600}

# ---- Score sheet sync schedule (Epic B) ----
# Provisional default per Decision Log Q2: Monday 08:00. Zone handling is parked (see §8) —
# "GMT" is a fixed UTC offset (no DST); switch to "Europe/London" if UK local clock time is intended.
# Also the default timezone for user-defined dynamic sync schedules (see SyncSchedule) when one isn't given.
sync.schedule.cron=${SYNC_SCHEDULE_CRON:0 0 8 ? * MON}
sync.schedule.zone=${SYNC_SCHEDULE_ZONE:GMT}

# Pool size for Spring's TaskScheduler — shared by the static weekly job above and every dynamic
# SyncSchedule, each of which holds its own recurring slot for as long as it stays enabled.
spring.task.scheduling.pool.size=${SYNC_SCHEDULER_POOL_SIZE:5}

# ---- AWS S3 (SharePoint file store) ----
aws.s3.region=${AWS_REGION:eu-west-1}
aws.s3.bucket=${S3_BUCKET:lab-results-validator-bucket}
# Static keys injected by CI (the box has no instance role). Leave blank locally to use the
# default AWS credentials chain (~/.aws credentials, env vars, etc.).
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Suppress verbose Graph SDK / Kiota / Azure / OkHttp noise
logging.level.com.microsoft.graph=WARN
logging.level.com.microsoft.kiota=WARN
logging.level.com.azure=WARN
logging.level.okhttp3=WARN
logging.level.reactor.netty=WARN
