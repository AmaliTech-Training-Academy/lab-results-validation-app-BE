# Test configuration — an OVERLAY on src/main/resources/application.properties, activated by
# @ActiveProfiles("test").
#
# It must be named application-test.properties, not application.properties: a file with the latter
# name in src/test/resources sits earlier on the classpath and *replaces* the main one outright
# rather than adding to it, which silently strips mail, JWT and JPA configuration and leaves the
# context failing on a missing JavaMailSender. Cost an hour once; don't rename it back.
#
# Its first job is unglamorous: application.properties requires 14 environment placeholders that have
# no default (DB_*, REDIS_*, AZURE_*, MAIL_*, JWT_SECRET, SHAREPOINT_SITE_ID). Until this file existed
# a Spring context could not start in a test at all, which is why there were none.
#
# The datasource and Redis values below are placeholders only. Testcontainers overrides them through
# @ServiceConnection at runtime, but the property placeholders still have to resolve for the context
# to build, so they need *some* value here.

DB_HOST=localhost
DB_PORT=5432
DB_NAME=validata_test
DB_USER=test
DB_PASSWORD=test
REDIS_HOST=localhost
REDIS_PORT=6379

# Never used — Graph is not reachable from a test and must not be. The fixture drive is what serves
# the SharePoint contract. A recognisable value makes it obvious in a stack trace if something ever
# does try to reach the real thing.
AZURE_TENANT_ID=test-tenant-must-not-be-used
AZURE_CLIENT_ID=test-client-must-not-be-used
AZURE_CLIENT_SECRET=test-secret-must-not-be-used

# Matches validata.sharepoint.fixture.site-id below, so Gate 1's sanctioned-site check passes.
# A test that wants to prove the *refusal* overrides this to something else.
SHAREPOINT_SITE_ID=fixture-site

# Mail credentials, and two constraints that pull against each other:
#   1. spring.mail.username must be a VALID ADDRESS — EmailService uses it as the From address
#      (EmailService.java:47), so blanking it fails every send with "Illegal address".
#   2. Because the username is set, JavaMailSenderImpl passes it to Transport.connect() and AUTH is
#      negotiated whatever mail.smtp.auth says. Turning that property off is not enough.
# So the test SMTP server is given a user matching exactly these values (see TestMailServer).
# Worth noting for the runbook: the From address IS the SMTP username, so rotating the mail
# credentials silently changes who the emails appear to come from.
MAIL_USERNAME=validata@example.test
MAIL_PASSWORD=test-smtp-password
spring.mail.properties.mail.smtp.starttls.enable=false
# Must be valid BASE64 — the JWT library decodes it before use, so a readable passphrase with
# hyphens fails at login with "Illegal base64 character" rather than anything about signing.
JWT_SECRET=dmFsaWRhdGEtdGVzdC1vbmx5LWhzMjU2LXNpZ25pbmcta2V5LTQ4Ynl0ZXMtbG9uZyEh

# ---- The drive is served from fixtures, never from Graph ----
validata.sharepoint.source=fixtures
validata.sharepoint.fixture.site-id=fixture-site
validata.sharepoint.fixture.web-url-base=https://fixtures.invalid/sites/validata
# Each test supplies its own root via a DynamicPropertySource, pointing at a temp directory it built.
validata.sharepoint.fixture.root=

# Retries exist for Graph throttling. A fixture drive never throttles, so backoff would only make the
# suite slow; keep one attempt and no sleeping.
validata.graph.retry.max-attempts=1
validata.graph.retry.initial-backoff-millis=0
validata.graph.retry.max-backoff-millis=0

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# Loud enough to diagnose a failing run, quiet enough to read.
logging.level.com.amalitech.labresultsvalidator=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
