# Local dev override — NOT the tracked compose file.
# Host 5432 is taken by a native PostgreSQL, so expose our container Postgres on
# 5433 instead. The container still listens on 5432 internally; only the host
# mapping changes. Run the host app with DB_PORT=5433.
services:
  postgres:
    # !override replaces the base ports list instead of appending to it
    # (Compose merges sequences by default, which kept the conflicting 5432).
    ports: !override
      - "5433:5432"
  app:
    # The host's systemd-resolved stub (127.0.0.53) is flaky from inside the
    # container, causing intermittent UnknownHostException on SharePoint
    # (ENV-1). Give the app explicit public resolvers so outbound Graph calls
    # resolve reliably.
    dns:
      - 8.8.8.8
      - 1.1.1.1
