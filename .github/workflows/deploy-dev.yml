name: Deploy Dev (backend)

# On merge to develop: build the image, push to ECR, then deploy over SSM (no SSH / no
# inbound port 22). The EC2 box has an SSM-only instance role and reads its .env directly from
# SSM Parameter Store (/labresults/dev/*) via /opt/app/refresh-env.sh — CI never handles the
# app's secret values at all, it just triggers refresh-env.sh + `docker compose pull && up -d`
# over SSM. To change a config value: `aws ssm put-parameter --name /labresults/dev/<KEY>
# --value <new> --overwrite`, then re-run this workflow (or just re-trigger a deploy).

on:
  push:
    branches: [develop]
    paths:
      - "labresultsvalidator/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC, to push to ECR + mint the ECR token
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: labresults-dev-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" ./labresultsvalidator
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      - name: Deploy over SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Mint an ECR token (CI has AWS creds via OIDC); the box uses it to log in itself.
          # Short-lived (12h), so it's fine to pass directly in the SSM command.
          ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_TOKEN"

          REMOTE_SCRIPT=$(printf '%s\n' \
            "set -eu" \
            "/opt/app/refresh-env.sh" \
            "echo '$ECR_TOKEN' | docker login --username AWS --password-stdin '$REGISTRY'" \
            "cd /opt/app" \
            "docker compose pull app" \
            "docker compose up -d redis app" \
            "docker image prune -f")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[$(jq -Rs . <<< "$REMOTE_SCRIPT")]}" \
            --comment "deploy-dev ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          # Poll until the command reaches a terminal status.
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                echo "SSM command ended with status $STATUS" >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not complete in time (last status: $STATUS)" >&2
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
