name: Deploy Dev (backend)

# On merge to develop: build the image, push to ECR, then deploy over SSM (no SSH / no
# inbound port 22). The EC2 box has an SSM-only instance role and reads its .env directly from
# SSM Parameter Store (/labresults/dev/*) via /opt/app/refresh-env.sh — CI never handles the
# app's secret values at all, it just triggers refresh-env.sh + `docker compose pull && up -d`
# over SSM. To change a config value: `aws ssm put-parameter --name /labresults/dev/<KEY>
# --value <new> --overwrite`, then re-run this workflow (or just re-trigger a deploy).

on:
  push:
    branches: [develop]
    paths:
      - "labresultsvalidator/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC, to push to ECR + mint the ECR token
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: labresults-dev-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" ./labresultsvalidator
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      # Resolved by tag rather than read from a stored secret: the box runs on Spot, so its
      # instance ID changes every time it is reclaimed and recreated, and a pinned
      # DEPLOY_INSTANCE_ID secret goes stale the first time that happens.
      - name: Resolve the box
        id: box
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=labresults-dev" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running instance tagged labresults-dev — has Spot reclaimed it?" >&2
            echo "The Recover Dev Box workflow rebuilds it; re-run this deploy afterwards." >&2
            exit 1
          fi

          echo "Deploying to $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ steps.box.outputs.instance_id }}
        run: |
          chmod +x infra/scripts/deploy-over-ssm.sh
          # redis app only: this workflow builds the backend, so leave the frontend running.
          infra/scripts/deploy-over-ssm.sh \
            "$INSTANCE_ID" "$REGISTRY" "deploy-dev ${{ github.sha }}" redis app
