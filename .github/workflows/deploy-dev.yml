name: Deploy Dev (backend)

# On merge to develop: build the image, push to ECR, then deploy over SSM (no SSH / no
# inbound port 22). The EC2 box has an SSM-only instance role. Long-lived secrets (.env) are
# staged in a private S3 bucket and pulled down by the box, since SSM command parameters land
# in plaintext in command history/CloudTrail; the ECR login token is short-lived (12h) so it's
# passed directly in the SSM command. Then `docker compose pull && up -d` runs on the box.

on:
  push:
    branches: [develop]
    paths:
      - "labresultsvalidator/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC, to push to ECR + mint the ECR token
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: labresults-dev-backend
  DB_HOST: development-db.cv0268q40734.eu-west-1.rds.amazonaws.com
  DB_NAME: lab_results_validator
  S3_BUCKET: lab-results-validator-bucket

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" ./labresultsvalidator
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      - name: Deploy over SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          DEPLOY_STAGING_BUCKET: ${{ secrets.DEPLOY_STAGING_BUCKET }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # NOT named AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY on purpose: those reserved names
          # would override the OIDC deploy-role creds and make the `aws ecr get-login-password`
          # call below run as the S3-only app user (no ECR access). Kept app-scoped here and
          # written into the box .env under the real names further down.
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Microsoft Graph / SharePoint. The app builds the Graph client eagerly at startup and
          # crashes with "Invalid tenant id" without these, so they MUST be in the box .env.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
        run: |
          set -euo pipefail

          # Build .env locally and stage it in S3 (never as an SSM command parameter — those are
          # stored in plaintext in SSM command history / CloudTrail). The box pulls and deletes it.
          {
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=5432"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "REDIS_HOST=redis"
            echo "REDIS_PORT=6379"
            echo "SPRING_JPA_HIBERNATE_DDL_AUTO=none"
            echo "CORS_ALLOWED_ORIGINS=*"
            echo "MAIL_USERNAME=$MAIL_USERNAME"
            echo "MAIL_PASSWORD=$MAIL_PASSWORD"
            echo "FRONTEND_URL=http://52.50.143.70"
            echo "BASE_URL=http://52.50.143.70"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY"
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "SHAREPOINT_SITE_ID=$SHAREPOINT_SITE_ID"
          } > env.deploy

          STAGING_KEY="deploy/${{ github.run_id }}/env.deploy"
          aws s3 cp env.deploy "s3://$DEPLOY_STAGING_BUCKET/$STAGING_KEY" --sse AES256
          rm -f env.deploy

          # Mint an ECR token (CI has AWS creds via OIDC); the box uses it to log in itself.
          ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_TOKEN"

          REMOTE_SCRIPT=$(printf '%s\n' \
            "set -eu" \
            "aws s3 cp s3://$DEPLOY_STAGING_BUCKET/$STAGING_KEY /opt/app/.env" \
            "aws s3 rm s3://$DEPLOY_STAGING_BUCKET/$STAGING_KEY" \
            "chown ubuntu:ubuntu /opt/app/.env" \
            "echo '$ECR_TOKEN' | docker login --username AWS --password-stdin '$REGISTRY'" \
            "cd /opt/app" \
            "docker compose pull app" \
            "docker compose up -d redis app" \
            "docker image prune -f")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[$(jq -Rs . <<< "$REMOTE_SCRIPT")]}" \
            --comment "deploy-dev ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          # Poll until the command reaches a terminal status.
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                echo "SSM command ended with status $STATUS" >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not complete in time (last status: $STATUS)" >&2
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
